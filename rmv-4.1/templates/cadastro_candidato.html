<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadastro de Candidato | RM Facilities</title>
<style>
:root{--blue:#155e75;--teal:#0f766e;--ink:#17363c;--muted:#63777d;--line:#cddedf;--bg:#f3f8f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Segoe UI",Tahoma,sans-serif}.wrap{max-width:960px;margin:auto;padding:18px 14px 48px}.hero{padding:22px 4px 18px}.hero h1{margin:0;font-size:27px}.hero p{color:var(--muted);margin:6px 0 0;line-height:1.45}.form{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 12px 28px #0c4d4d14}.section{padding:18px;border-bottom:1px solid var(--line)}.section h2{font-size:16px;margin:0 0 14px;color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:#456067;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:92px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid #d5f0ec;border-color:var(--teal)}.hint{font-size:11px;color:var(--muted);margin-top:4px;min-height:14px}.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#415d62}.check input{width:auto;margin-top:3px}.submit{padding:20px}.submit button{border:0;border-radius:8px;padding:13px 18px;background:linear-gradient(120deg,var(--teal),var(--blue));color:#fff;font-weight:700;font-size:15px;cursor:pointer}.submit button:disabled{opacity:.65}.message{margin-top:12px;padding:10px;border-radius:7px;display:none}.message.error{display:block;background:#fff1f1;color:#9b1c1c}.message.ok{display:block;background:#ecfcf4;color:#14633f}@media(max-width:620px){.grid,.grid.three{grid-template-columns:1fr}.hero h1{font-size:23px}.section{padding:15px}}
</style>
</head>
<body><main class="wrap"><header class="hero"><h1>Cadastro de Candidato</h1><p>Preencha sua ficha para participar dos processos seletivos da RM Facilities. Os dados serao enviados diretamente ao RH.</p></header>
<form id="form" class="form"><input name="website" tabindex="-1" autocomplete="off" style="display:none">
<section class="section"><h2>Vaga</h2><div class="grid"><div><label>Cargo desejado</label><input name="cargo_desejado"></div><div><label>Pretensao salarial</label><input name="pretensao_salarial" inputmode="decimal"></div></div></section>
<section class="section"><h2>Dados pessoais</h2><div class="grid three"><div class="full"><label>Nome completo *</label><input name="nome" required></div><div><label>Nacionalidade</label><input name="nacionalidade"></div><div><label>Naturalidade</label><input name="naturalidade"></div><div><label>Data de nascimento</label><input name="data_nascimento" type="date"></div><div><label>Estado civil</label><select name="estado_civil"><option value="">Selecione</option><option>Solteiro(a)</option><option>Casado(a)</option><option>Uniao estavel</option><option>Divorciado(a)</option><option>Viuvo(a)</option></select></div><div><label>Nome do esposo(a)</label><input name="nome_conjuge"></div><div><label>Nome do pai</label><input name="nome_pai"></div><div><label>Nome da mae</label><input name="nome_mae"></div><div><label>Tem filhos? Quantos?</label><input name="filhos" placeholder="Ex.: Sim, 2"></div><div><label>Numero calca / camisa / sapato</label><input name="vestuario" placeholder="Ex.: 40 / M / 39"></div><div><label>Peso / Altura</label><input name="peso_altura" placeholder="Ex.: 70 kg / 1,70 m"></div></div></section>
<section class="section"><h2>Informacoes residenciais</h2><div class="grid three"><div><label>CEP</label><input id="cep" name="cep" inputmode="numeric" maxlength="9" placeholder="00000-000"><div id="cep-hint" class="hint"></div></div><div class="full"><label>Endereco</label><input id="endereco" name="endereco"></div><div><label>Numero / Complemento</label><input name="numero_complemento"></div><div><label>Bairro / Regiao</label><input id="bairro" name="bairro_regiao"></div><div><label>Cidade / UF</label><input id="cidade-uf" name="cidade_uf"></div><div><label>Telefone</label><input name="telefone" inputmode="tel" maxlength="15" placeholder="(00) 0000-0000"></div><div><label>Celular *</label><input name="celular" inputmode="tel" maxlength="15" placeholder="(00) 00000-0000" required></div><div><label>Telefone para recado</label><input name="recado" inputmode="tel" maxlength="15" placeholder="(00) 00000-0000"></div><div class="full"><label>E-mail *</label><input name="email" type="email" required></div></div></section>
<section class="section"><h2>Documentacao</h2><div class="grid"><div><label>RG (numero, estado e emissao)</label><input name="rg" inputmode="numeric" placeholder="00.000.000-0"></div><div><label>Carteira profissional (numero, serie e estado)</label><input name="carteira_profissional" inputmode="numeric" placeholder="0000000-0000/SP"></div><div><label>Titulo de eleitor (numero, zona e secao)</label><input name="titulo_eleitor" inputmode="numeric" placeholder="0000.0000.0000"></div><div><label>CPF</label><input name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div><div><label>Certificado militar</label><input name="certificado_militar" inputmode="numeric" placeholder="000.000.000-0"></div><div><label>CNH (numero, validade e categoria)</label><input name="cnh" inputmode="numeric" placeholder="00000000000"></div><div><label>PIS / Data</label><input name="pis" inputmode="numeric" placeholder="000.00000.00-0"></div><div><label>Outro documento</label><input name="outro_documento"></div></div></section>
<section class="section"><h2>Escolaridade</h2><div class="grid"><div><label>Ensino fundamental</label><select name="ensino_fundamental"><option value="">Selecione</option><option>1a a 4a serie</option><option>5a a 8a serie</option><option>Completo</option></select></div><div><label>Ensino medio</label><select name="ensino_medio"><option value="">Selecione</option><option>Completo</option><option>Incompleto</option><option>Cursando</option></select></div><div><label>Ensino superior / Curso</label><input name="ensino_superior"></div><div><label>Instituicao</label><input name="instituicao"></div><div><label>Cursos</label><input name="cursos" placeholder="Vigilante, Portaria, Bombeiro Civil..."></div><div><label>Lingua / Informatica</label><input name="idiomas_informatica"></div><div><label>Outros cursos</label><input name="outros_cursos"></div><div><label>Data do curso / Academia ou escola</label><input name="formacao_extra"></div></div></section>
<section class="section"><h2>Ultimo ou atual emprego</h2><div class="grid"><div><label>Nome da empresa</label><input name="ultimo_empresa"></div><div><label>Cargo</label><input name="ultimo_cargo"></div><div><label>Endereco</label><input name="ultimo_endereco"></div><div><label>Ultimo salario</label><input name="ultimo_salario"></div><div><label>Admissao / Demissao</label><input name="ultimo_periodo" placeholder="dd/mm/aaaa - dd/mm/aaaa"></div><div><label>Motivo da saida</label><input name="ultimo_motivo"></div></div></section>
<section class="section"><h2>Penultimo emprego</h2><div class="grid"><div><label>Nome da empresa</label><input name="penultimo_empresa"></div><div><label>Cargo</label><input name="penultimo_cargo"></div><div><label>Endereco</label><input name="penultimo_endereco"></div><div><label>Ultimo salario</label><input name="penultimo_salario"></div><div><label>Admissao / Demissao</label><input name="penultimo_periodo" placeholder="dd/mm/aaaa - dd/mm/aaaa"></div><div><label>Motivo da saida</label><input name="penultimo_motivo"></div></div></section>
<section class="section"><h2>Indicacao</h2><div class="grid"><div><label>Parentes na empresa / Grau</label><input name="parentes_empresa"></div><div><label>Nome do parente / Local de trabalho</label><input name="nome_parente_local"></div><div><label>Ja trabalhou na empresa? Local</label><input name="ja_trabalhou"></div><div><label>Motivo da saida / Periodo</label><input name="empresa_saida_periodo"></div><div><label>Como conheceu a empresa?</label><input name="origem_vaga" placeholder="Anuncio, jornal, indicacao..."></div><div><label>Recomendacao de funcionario</label><input name="recomendacao"></div><div class="full"><label>Local de trabalho desejado</label><input name="local_trabalho"></div><div class="full"><label>Escreva uma carta solicitando o emprego</label><textarea name="carta"></textarea></div></div></section>
<section class="submit"><label class="check"><input type="checkbox" name="declaracao" required>Declaro que as informacoes prestadas sao verdadeiras e autorizo o uso destes dados para o processo seletivo.</label><button id="send" type="submit">Enviar ficha de cadastro</button><div id="msg" class="message"></div></section></form></main>
<script>
var form=document.getElementById('form'),msg=document.getElementById('msg'),send=document.getElementById('send');
function digitos(v){return String(v||'').replace(/\D/g,'');}
function mascaraCpf(v){v=digitos(v).slice(0,11);return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');}
function mascaraCep(v){v=digitos(v).slice(0,8);return v.replace(/(\d{5})(\d)/,'$1-$2');}
function mascaraTel(v){v=digitos(v).slice(0,11);if(v.length<=10)return v.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{4})(\d)/,'$1-$2');return v.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2');}
function mascaraRg(v){v=digitos(v).slice(0,9);return v.replace(/(\d{2})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)$/,'$1-$2');}
function mascaraPis(v){v=digitos(v).slice(0,11);return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{5})(\d)/,'$1.$2').replace(/(\d{2})(\d)$/,'$1-$2');}
function mascaraTitulo(v){v=digitos(v).slice(0,12);return v.replace(/(\d{4})(\d)/,'$1.$2').replace(/(\d{4})(\d)/,'$1.$2');}
function aplicarMascara(nome,fn){var el=form.elements[nome];if(el)el.addEventListener('input',function(){this.value=fn(this.value)});}
aplicarMascara('cpf',mascaraCpf);aplicarMascara('cep',mascaraCep);aplicarMascara('telefone',mascaraTel);aplicarMascara('celular',mascaraTel);aplicarMascara('recado',mascaraTel);aplicarMascara('rg',mascaraRg);aplicarMascara('pis',mascaraPis);aplicarMascara('titulo_eleitor',mascaraTitulo);
var cepInput=document.getElementById('cep'),cepHint=document.getElementById('cep-hint'),ultimoCep='';
function buscarCep(){var cep=digitos(cepInput.value);if(cep.length!==8||cep===ultimoCep)return;ultimoCep=cep;cepHint.textContent='Buscando endereco...';fetch('/api/cep/'+cep).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})}).then(function(r){if(!r.ok)throw new Error(r.d.erro||'CEP nao encontrado.');var d=r.d;document.getElementById('endereco').value=[d.logradouro,d.complemento].filter(Boolean).join(', ');document.getElementById('bairro').value=d.bairro||'';document.getElementById('cidade-uf').value=[d.localidade||d.cidade,d.uf||d.estado].filter(Boolean).join(' / ');cepHint.textContent='Endereco preenchido automaticamente.';}).catch(function(e){cepHint.textContent=e.message;ultimoCep='';});}
cepInput.addEventListener('input',function(){if(digitos(this.value).length===8)buscarCep();else{ultimoCep='';cepHint.textContent='';}});cepInput.addEventListener('blur',buscarCep);
form.addEventListener('submit',function(e){e.preventDefault();if(!form.reportValidity())return;var d={};new FormData(form).forEach(function(v,k){d[k]=v});d.declaracao=form.elements.declaracao.checked;send.disabled=true;send.textContent='Enviando ficha...';msg.className='message';fetch('/api/cadastro-candidato',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})}).then(function(r){if(!r.ok)throw new Error(r.d.erro||'Nao foi possivel enviar a ficha.');msg.textContent=r.d.mensagem;msg.className='message ok';form.reset();window.scrollTo({top:0,behavior:'smooth'});}).catch(function(e){msg.textContent=e.message;msg.className='message error';}).finally(function(){send.disabled=false;send.textContent='Enviar ficha de cadastro';});});
</script></body></html>
